# Docs: https://github.com/Azure/webapps-deploy
name: Build and deploy Vite React app to Azure Web App - fe-react

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install and build
        env:
          # 왼쪽 이름은 코드의 import.meta.env.VITE_* 와 반드시 일치해야 함
          # 오른쪽 secrets.* 는 이 repo 에 등록된 실제 secret 이름으로 맞출 것
          VITE_API_URL: ${{ secrets.API_URL }}
          VITE_BLOB_URL: ${{ secrets.BLOB_URL }}
        run: |
          npm ci
          npm run build

      # Vite 빌드 산출물(dist)만 업로드 (node_modules/소스 제외)
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'fe-react'
          slot-name: 'Production'
          package: dist
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_C5A34CFDFDEB4067B1BADDC9CA17FCBA }}
